{% extends "base.html" %}
{% load static %}

{% block title %}用户登录 - Vectory{% endblock %}

{% block content %}
<div class="card mx-auto mt-5 px-3" style="max-width: 400px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
    <div class="card-header bg-primary text-white text-center">
        <h5 class="mb-0">系统登录</h5>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" id="id_username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">密码</label>
                <input type="password" name="password" class="form-control" id="id_password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">登录</button>
            </div>
        </form>
    </div>
</div>

<style>
    /* 移动端优化 */
    @media (max-width: 576px) {
        .card-body {
            padding: 1.5rem;
        }

        .form-control {
            font-size: 1rem;
        }

        .btn {
            font-size: 1rem;
        }
    }

    /* 按钮样式 */
    .btn-primary {
        transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .btn-primary:hover {
        background-color: #0056b3;
        transform: scale(1.05);
    }

    .btn-primary:focus {
        box-shadow: 0 0 0 0.25rem rgba(38, 143, 255, 0.5);
    }

    /* 卡片阴影效果 */
    .card {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    /* 输入框和按钮的聚焦效果 */
    .form-control:focus,
    .btn:focus {
        border-color: #0056b3;
        box-shadow: 0 0 0 0.2rem rgba(38, 143, 255, 0.5);
    }
</style>
{% endblock %}
