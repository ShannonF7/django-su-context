        var map = new AMap.Map('container', {

        var spotsData = [{"name": "南堡门", "position": [111.97355, 36.96195], "introduction": "石砌堡门，门上雕刻龙头，象征龙首。门外铺设九条红石路，象征龙须。南堡门是通往古堡内部的重要入口。"}, {"name": "关帝庙", "position": [111.973735, 36.961672], "introduction": "由庙门组合戏台、抱厦组合献殿、正殿、左右配殿组成。庙中戏台小巧玲珑，抱厦组合献殿修建得很精致，献殿内左右立满仪仗、古碑，记录修造、功德事。正殿造于康熙、雍正年间，廊下有古碑，叙述关帝庙修造来由，正殿内清代壁画保存十分完整，画法妙丽，颇见功底。"}, {"name": "可罕庙", "position": [111.97333, 36.96195], "introduction": "始建年代不详，庙内碑文记载曾于元代延祐元年（1314 年）重建，明天启六年再次重建，现存建筑为乾隆三十二年修缮后的原貌"}, {"name": "古校军场", "position": [111.97338, 36.96191], "introduction": "张壁古堡的校军场一般指的是堡内较为开阔的场地，位于古堡的重要位置，是古代军队进行训练、检阅等军事活动的场所。校军场是张壁古堡军事功能的重要体现之一，见证了古堡在历史上的军事防御作用。从十六国的后赵时期开始，张壁古堡历经多个朝代的修缮和扩建，校军场也一直发挥着重要作用，承载着深厚的历史文化内涵。如今的校军场依然保留着较为开阔的空间格局，周围环绕着古老的建筑和城墙，地面由青石铺就，虽然历经岁月沧桑，但仍能感受到当年的雄浑气势"}, {"name": "西场巷巷门", "position": [111.9733, 36.96184], "introduction": "西场巷巷门多采用砖石结构，以青石为基础，青砖砌墙，木材用于制作门楣、门框和门板等。这种材质组合使得巷门坚固耐用，能够抵御一定的风雨侵蚀和外力冲击。巷门整体造型古朴典雅，通常为拱形或方形。拱形巷门线条流畅，给人一种柔和而稳重的感觉；方形巷门则显得更加规整、端庄。门上方一般会有精美的砖雕装饰，包括花卉、动物、人物等图案，寓意吉祥美好，展现了当时高超的雕刻工艺。作为古堡防御体系的一部分，西场巷巷门在军事防御方面发挥了重要作用。一旦有敌军入侵，关闭巷门后，西场巷就成为一个相对独立的防御区域，与其他街巷相互配合，可形成对敌人的合围之势，有效抵御外敌。"}, {"name": "双龙碾", "position": [111.97285, 36.9617], "introduction": "由褐黑色花岗岩雕凿而成的碾滚和麻子石制成的碾盘组成。碾滚通体呈圆柱形，长 0.48 米，直径为 0.60 米，面上石齿已被磨平；碾盘直径为 1.47 米。在电磨问世之前，张壁老百姓一直用双龙碾加工粮食。明代蒙古兵入侵，村外居民被迫搬回村内居住，碾子留在原处并未带回，后来关帝庙僧人为方便加工米面而将其迁入庙内。相传很久以前，村里有人用此碾子碾粮食，斗升的米硬是一整天没碾完，碾子 “盛产” 粮食的故事就此传开。后来碾棚着火，火灭后草棚破败不堪，碾轴飞灰湮灭，但水淋淋的碾滚上忽现龙形图案，老百姓见此纷纷跪地而拜。此后，浇水出龙的奇观便延续至今。"}, {"name": "少林禅弓院", "position": [111.97295, 36.96172], "introduction": "“少林禅弓” 是少林寺方丈释永信大和尚的创意，禅为禅心，是一种清静寂定的心境，弓则指射艺，习射者讲求形端志正，需要内心纯正平静，心无他物，禅和弓都是一种内心的宁静，禅是弓之体，弓是禅之用，禅弓是以一颗不动心 —— 禅心来拉弓射箭，在此理念下少林禅弓院应运而生，张壁古堡少林禅弓院也在传统民居的基础上加以改造修建而成。"}, {"name": "星象文化展厅", "position": [111.97343, 36.96111], "introduction": "位于山西省介休市龙凤镇张壁村的张壁古堡内，这里是中国现有较为完好的一座融军事、居住、生产、星象、宗教活动为一体的古代袖珍 “城堡”，被称为 “中国星象第一村”。张壁古堡的建造遵循中国传统古代星象和堪舆理念，地面布局与天上的二十八星宿相对应，星象文化展厅便是为了展示这独特的星象文化而设立。"}, {"name": "西方圣境殿", "position": [111.97348, 36.96204], "introduction": "始建年代不详，重建于康熙五十九年。殿内供奉着接引众生往生西方净土的阿弥陀佛、大势至菩萨和观音菩萨。是张壁古堡宗教文化的重要代表，反映了当时人们对于西方净土的信仰和追求，承载着当地居民的精神寄托，也体现了佛教文化在张壁古堡的传播与发展。古堡内宗教建筑众多，西方圣境殿与其他佛教、道教等庙宇共存，体现了不同宗教文化在同一地域的和谐共存与融合，对于研究古代宗教文化的传播、发展以及宗教与社会的关系具有重要的意义。"}, {"name": "魁星楼", "position": [111.97358, 36.96191], "introduction": "又名 “魁星阁”，是为儒士学子心目中主宰文章兴衰的魁星神而建的古代建筑。“魁星神” 与 “文昌神” 并列，是我国古代神话中的主文运、文章的神。在古代天文学中，魁星有不同说法，一说指北斗七星中前四颗星天枢、天璇、天玑、天权的总称，也称作 “斗魁”；二是专指北斗星中的天枢星；三是指古代神话中的神 “奎星” 的俗称，“奎星” 原是古代天文学中二十八宿之一，称为 “奎宿”，后被视为主宰文章兴衰的神。"}, {"name": "1号古灯杆", "position": [111.97333, 36.96195], "introduction": "张壁古堡地势险要，是兵家必争之地。在古代，一旦有紧急军情，如敌人夜间来袭，哨兵就会在灯杆前将灯点亮，并用滑轮将灯笼送往杆顶。张壁到介休这段路程有几个古寨，每个古寨制高点都有烽火台，只要张壁一点信号灯，沿线的烽火台都会相继点燃，这样不仅介休城，甚至更远的地方都可以收到信号，“张壁点灯，介休看明” 的说法便由此而来。在平时，古灯杆上悬挂的灯笼也可能起到指示方向或标识城堡位置的作用，为过往行人、商队等指引方向，使其在远处就能看到张壁古堡的位置。古灯杆作为张壁古堡的重要组成部分，见证了古堡从军事要塞到商业重镇再到文化旅游景点的历史变迁，承载着丰富的历史信息，是研究古代军事、交通、文化等方面的重要实物资料。张壁古堡魁星楼上有一个古灯，古灯在古时候是用来传递信号的作用，原来有种说法叫张壁点灯介休看明，介休是在北方大概10公里左右处，但是这个说法当时在1997年时候，一个清华大学教授就提出了疑问，他觉得这边如果点着灯的话应该在地球是看不到的，他就干嘛，当时我来到这边以后徒步从张壁村往介休市区走，结果在村子的邻村点以后，一个制高点发现了烽火台的遗址，所以推测出来可能是依次传递下去的，因为古代作战的时候它是白天点烟，晚上点灯来传递信号，底座是原始留下来的，杆是后期修建的。"}, {"name": "地道一号线入口", "position": [111.97333, 36.96195], "introduction": "张壁古堡的地道入口分布较为隐蔽，它们巧妙地设置在古堡内的不同地方，例如居民的宅院、庙宇的附属建筑、甚至是一些看似普通的房间之中，这种分布方式使得地道入口不易被发现，极大地增加了古堡的军事防御的隐蔽性和安全性。其中，较为著名的入口包括可汗庙内的地道入口、居民窑洞内的地道入口等。地道入口的设置与古堡的整体布局紧密结合，有些入口可能位于交通要道附近，方便在敌人来袭时快速进入地道；有些则位于高处或低处，以便根据实际情况灵活利用地道进行防守或反击。"}, {"name": "地道出口", "position": [111.97111, 36.96353], "introduction": "地道出口分布在张壁古堡及其周边的不同位置，它们遍布在山谷、沟谷、树林、山坡等地方，布局十分分散，其目的是为了保证人员能够从多个方向安全撤离或展开军事行动，避免被敌人集中包围。例如，有些出口设置在距离古堡较远的山谷之中，有些则位于古堡附近的山坡背面，以确保隐蔽性和安全性。地道出口充分利用了古堡周边的自然地形，使其与环境融为一体。有的出口巧妙地隐藏在一片树林之中，从外面很难察觉；有的则利用了沟谷的地形，通过在沟谷的侧壁设置出口，借助地形的起伏和植被的遮挡，使得出口难以被发现。在古代，地道出口是军事行动的关键环节，当敌人包围古堡时，守军可以从不同的出口悄无声息地突围出去，实施奇袭或转移至安全地带；也可以利用出口对敌人进行反包围，从意想不到的方向发起攻击，出其不意地打击敌人。"}, {"name": "龙鹤福", "position": [111.97269, 36.96235], "introduction": "位于张壁古堡某建筑上，“龙” 象征权力与尊贵，“鹤” 寓意长寿吉祥，“福” 字传达对美好生活的向往，整体融合体现古人对家族兴旺等的期望"}, {"name": "永春楼", "position": [111.97338, 36.96245], "introduction": "建筑具有独特的历史渊源和风格，可能采用了特殊的木结构等传统工艺，随着时间推移功能有所演变，从最初的居住等用途逐渐转变为承载文化展示等功能"}, {"name": "中央戊已土（影子钟）", "position": [111.97326, 36.96264], "introduction": "整个村子是按照五行八卦布局的，此处在五行中称作戊己中央土，在上古时期，中国就已经有了祭祀制度，把土筑的高台称为社，把谷物称为稷，但是土地广博，谷物众多，不能一一敬之，所以我们在北京的中山公园看到的社稷坛就是用来祭拜土地和谷物的，咱们现在所处的就是古堡人的祖先曾经祭土的地方，祭社稷的地方需要一块洁净之地，所以这里历来是没有建筑的。"}, {"name": "古槐客栈（悠悠心舍大堂）", "position": [111.97287, 36.96341], "introduction": "依托古槐营造出独特的自然景观和古朴氛围，为游客提供住宿等服务，同时通过布置传统装饰、提供特色美食、举办文化活动等方式传播地方文化"}, {"name": "槐抱柳", "position": [111.97311, 36.96307], "introduction": "解放战争时期，古堡内的槐树受损后柳树在其树洞或根部生长，形成独特共生景观，象征着顽强生命力与坚韧精神，承载着当地居民的情感记忆"}, {"name": "兴隆寺", "position": [111.97303, 36.96325], "introduction": "寺庙采用传统中式建筑风格并融合地方特色元素，举办佛教法事等活动传播佛教文化与思想，是当地宗教信仰和文化交流的重要场所"}, {"name": "三大士殿", "position": [111.97317, 36.96354], "introduction": "供奉文殊、普贤、观音三位菩萨，代表佛教的智慧、行愿、慈悲精神，殿内琉璃佛像工艺精美，体现古代技艺水平和宗教艺术魅力"}, {"name": "真武庙", "position": [111.97322, 36.9634], "introduction": "真武殿重建于嘉庆十三年，公元1808年,距今已有210年的历史。因为真武大帝是掌管北方的水神，所以将它建在了张壁古堡的北堡门上方。供奉真武大帝，彰显其在道教中的重要地位，殿内有描绘真武大帝修行故事的壁画，建筑装饰特色鲜明，如龟蛇二将守护形象寓意深刻，孔雀蓝琉璃装饰珍贵稀有"}, {"name": "空王行祠", "position": [111.97325, 36.96305], "introduction": "与空王佛的传说紧密相连，讲述其生平事迹与教化众生的故事，体现佛教文化在当地的传播，祠内有独特的葫芦形石碑蕴含哲理，明代琉璃建筑构件精美绝伦建于明万历41年，公元1613年，最值得看的就是它廊下的这两通孔雀蓝、琉璃杯，全国乃至全世界仅存的两通国宝级的文物，它珍贵，一是因为它的烧制工艺已经失传了，二也是因为它历史悠久，烧制于明万历年间，距今已经有400多年的历史了。三也是因为它是通体烧制，它的烧制和搬运都比较复杂和困难，能保存到至今实属不易。整个杯是分为三个部分烧制要拼接在一起的，分别是杯首、杯身和杯座，杯首是双龙盘踞，杯身是通体孔雀蓝烧制，所以做的是刮皮调釉。"}, {"name": "二郎庙", "position": [111.97362, 36.96395], "introduction": "位于古堡北端，供奉二郎神，关联着桃山救母等传说，体现二郎神的大孝与水利之神等形象，举办祭祀活动祈求庇佑，建筑结构遵循传统风水理念"}, {"name": "北堡门", "position": [111.97321, 36.96401], "introduction": "砖砌而成，是古堡的重要防御关卡，采用坚固材料与合理结构，对应星宿体现天文文化，见证古堡的历史变迁，门上木雕精美，供奉真武大帝，壁画描绘其修行场景"}, {"name": "古照壁", "position": [111.97323, 36.9631], "introduction": "照壁上有精美的砖雕、石雕工艺，图案寓意反映当地文化，历经岁月保留历史痕迹，具有较高的文化遗产保护价值"}, {"name": "七星槐", "position": [111.9734, 36.96099], "introduction": "对应星宿，体现古人天文观念，象征意义与星宿传说相关，古槐形态独特具有观赏性，形成特定植物群落景观"}, {"name": "祈雨楼", "position": [111.97299, 36.96377], "introduction": "祈雨楼在张壁古堡天王殿的一个小楼，我是保存宋金时期的一座祈雨楼，这是原物原物木质结构榫卯结构的，因为过去老百姓主要的经济能来源是种地，山西比较的干雨水少，老百姓靠天吃饭，所以在过去除了供奉寺庙供奉神灵之外，他还会举行一场特别隆重的祈雨的仪式，会有几个人抬着这个楼，我抬着这个楼去祈雨，抬楼祈雨可以体现古堡民俗文化的比较的。"}, {"name": "琉璃视界展厅~在二郎庙里", "position": [111.97302, 36.96412], "introduction": "无"}, {"name": "游客中心", "position": [111.97318, 36.9605], "introduction": "张壁古堡游客中心位于景区入口附近，交通便利，无论是自驾还是乘坐公共交通前来的游客都能轻松找到。其中，南门游客中心位于南门检票口附近，北门游客中心则位于北门检票口附近。游客中心整体布局合理，功能区域划分明确，设有售票区、咨询区、休息区、展示区、购物区等不同区域，以满足游客的多样化需求。"}, {"name": "南门宴会厅", "position": [111.97275, 36.96063], "introduction": "是张壁古堡为游客提供餐饮服务的重要场所之一，可满足游客在游览古堡过程中的用餐需求，也可承接各类宴会活动。依托张壁古堡景区，有完善的配套设施，如景区内有充足的停车位，方便自驾游客前来就餐。景区还配备了公共休息区域、卫生间等设施，为游客提供便利。"}, {"name": "MR剧场《沉睡的古堡》", "position": [111.97265, 36.96054], "introduction": "由中国动漫集团监制，浙江安吉吾知科技有限公司、山西凯嘉张壁古堡生态旅游有限公司、世界城堡协会、北京吉光之境文化科技有限公司联合出品，中国移动提供 5G 技术支持。是国内首例且投资体量最大的大空间混合现实沉浸式互动体验项目（LBMR），成功入选 2024 年国家文化和旅游科技创新研发项目行列，还入围了 2024 年度金鸡 VR 影展。以 “探险 + 星宿” 为主题，以山西张壁古堡为蓝本，对古堡的千年古地下战道、琉璃艺术、星宿文化等特色资源进行提炼与影视化处理。体验者可在近 700 平米的大空间内，感受塌方的雀鼠谷考古现场等场景，体验乘电梯、木筏在水上行等情节。作为景区数字化转型的典范，打破了时间与空间的限制，成功助力地方景区跨区域布局，实现 “飞地营收”，是文化与旅游深度交融的创新之举，为游客提供了全新的沉浸式文旅体验，也为地方景区发展探索出了新路径。"}, {"name": "晚峰书屋", "position": [111.972817, 36.96183], "introduction": "晚峰书屋会举办以 “张壁古堡” 为主题的展览活动，通过图片、文字、实物、多媒体等多种形式，全方位展示张壁古堡的历史文化、建筑特色、民俗风情等。展览中可能会展示张壁古堡的历史变迁图片、挖掘出的文物复制品、古堡建筑的设计图纸等，让观众在参观展览的过程中，深入了解张壁古堡的前世今生。"}, {"name": "张壁有厚福（景区官方文创商店）", "position": [111.97346, 36.96202], "introduction": "位于张壁古堡红顺街，游客在游览古堡的过程中很容易就能找到，十分便利。作为张壁古堡的文化传播与交流平台，它肩负着展示和传承古堡文化的重要使命，将传统元素与现代设计巧妙融合，让游客通过文创产品更好地了解张壁古堡。围绕古堡的历史故事、建筑特色、民俗风情等，设计制作了各种文创产品，如印有古堡建筑、地道示意图、星象图案的明信片、笔记本、书签等，还有以古堡内的历史人物、神话传说为原型的玩偶、摆件等，让游客可以把张壁古堡的文化记忆带在身边。"}, {"name": "可汗庙戏台", "position": [111.97333, 36.96195], "introduction": "作为张壁古堡的一部分，可汗庙戏台见证了古堡的历史变迁和文化传承，是研究当地历史文化、宗教信仰和民俗风情的重要实物资料。从戏台的建筑风格和修缮痕迹中，可以了解到不同历史时期的建筑技艺和审美观念的发展变化。戏台的建筑结构和装饰艺术体现了古代工匠的高超技艺和智慧。其精美的木雕、砖雕、石雕以及彩画等装饰，具有很高的艺术欣赏价值，对于研究中国古代建筑装饰艺术的发展具有重要的参考意义。在过去，可汗庙戏台是当地村民举办戏曲演出、祭祀活动等的重要场所，承载着丰富的民俗文化内涵。如今，它依然是张壁古堡文化旅游的重要景点之一，通过举办各种文化活动和戏曲演出，继续传承和弘扬着当地的优秀传统文化。"}, {"name": "扎染坊", "position": [111.97348, 36.96204], "introduction": "张壁古堡的扎染坊位于红顺街，在这里游客可以体验传统扎染工艺，将白色布料变成独一无二的艺术品。"}, {"name": "姥姥院", "position": [111.97163, 36.96221], "introduction": "姥姥院曾经是古堡最富有的人家的住所，给人一种小时候姥姥家的感觉。姥姥院采用了典型的北方四合院布局，由正房、东西厢房和倒座房围合中间庭院而成，这种布局体现了中国传统建筑的对称美和秩序感，为居住者营造出安静、私密的空间。建筑的门窗、屋檐、墀头等部位都有精美的砖雕和木雕装饰。这些雕刻图案丰富多样，有花卉、动物、人物等，工艺精湛，线条流畅，栩栩如生，不仅展现了当时高超的雕刻技艺，也反映了主人的身份和品味。姥姥院作为古堡内保存较为完好的古建筑之一，承载着张壁古堡的历史记忆，见证了古堡的兴衰变迁。从建筑的风格和构造上，可以推断出当时的社会经济状况、建筑技术水平以及人们的生活方式，为研究张壁古堡的历史提供了重要的实物资料。姥姥院的存在也体现了张壁古堡丰富的民俗文化内涵。在这里，游客可以感受到浓厚的生活气息，了解到当地的传统民俗风情，如春节期间的贴春联、挂灯笼，以及各种祭祀、庆典活动等，这些民俗文化活动代代相传，成为张壁古堡文化的重要组成部分。"}, {"name": "农耕院", "position": [111.9714, 36.96225], "introduction": "农耕院采用典型的北方传统四合院式布局，由正房、厢房和倒座房围合中间庭院而成，这种布局体现了中国传统建筑的对称美和秩序感，也为展示农耕文化提供了较为独立和完整的空间。"}, {"name": "清宁堂", "position": [111.97133, 36.96211], "introduction": "清宁堂属于地上砖券窑结构，与黄土掏窑相比，结构更为复杂，成本也更高。这种窑洞式建筑具有良好的保温隔热性能，能够适应当地的气候条件，为居民提供舒适的居住环境。建筑的门窗、屋檐等部位有精美的木雕、砖雕装饰，图案丰富多样，包括花卉、动物、人物等，工艺精湛，线条流畅，栩栩如生，体现了古代工匠的高超技艺，也为建筑增添了艺术价值。清宁堂作为张壁古堡的一部分，承载着古堡的历史记忆，见证了古堡从军事要塞到民居村落的演变过程，对于研究张壁古堡的历史发展具有重要的实物资料价值。它是古堡居民生活的重要场所，反映了当时人们的生活方式、风俗习惯和社会文化。从清宁堂的布局和陈设中，可以了解到古代当地居民的家庭结构、宗教信仰、审美观念等方面的信息，是研究当地民俗文化的重要窗口。"}, {"name": "豆腐坊", "position": [111.97126, 36.96213], "introduction": "游客可以在豆腐坊工作人员的指导下，亲自参与豆腐制作的各个环节，如推磨、煮浆、点卤等，亲身体验传统豆腐制作的乐趣和艰辛，感受传统手工艺的独特魅力。制作完成后，游客可以品尝到自己亲手制作的新鲜豆腐，还能品尝到用豆腐制作的各种美食，如豆腐脑、麻婆豆腐、家常豆腐等，感受豆腐在不同菜肴中的丰富口感和独特风味。豆腐坊的存在为传承和弘扬豆腐文化提供了重要平台，让游客了解到豆腐的起源、发展以及制作工艺的演变，使这一传统美食文化得以延续和发展。张壁古堡豆腐坊所制作的豆腐具有浓郁的地方特色，它结合了当地的水质、原料和制作工艺，形成了独特的口感和风味，是张壁古堡地域文化的重要组成部分，也为游客提供了了解当地文化的窗口。"}, {"name": "星巴克", "position": [111.97088, 36.96237], "introduction": "张壁古堡的星巴克是将现代咖啡文化与古老古堡氛围相融合的特色门店。门店在装修风格上，将星巴克的现代简约风格与古堡的古朴元素相融合。可能保留了部分原始的建筑结构和材质，如裸露的砖石墙壁、木质房梁等，同时搭配星巴克标志性的绿色元素和舒适的座椅，营造出一种古今交融的独特情致。成为了古堡内的一个新的文化交流点，吸引着来自各地的游客，不同年龄段、不同文化背景的人在这里汇聚，促进了文化的交流与传播。也体现了张壁古堡在文化传承与发展方面的开放性和包容性，在保护和弘扬传统文化的同时，积极接纳现代文化元素，为古堡注入了新的活力。"}, {"name": "地道滑道入口", "position": [111.97051, 36.9618], "introduction": "张壁古堡在举办第八届地道中国年活动时有地道滑道这一游乐项目，该滑道是与地道体验相结合的游乐设施"}, {"name": "瓮城", "position": [111.97331, 36.96415], "introduction": "位于张壁古堡的北堡门外，是在砖砌的北堡门之外额外增建的防御设施，与北堡门共同构成了两道堡门，增强了古堡的整体防御性能。瓮城城门面向正东偏北开设，与北堡门不在一条中轴线上，这种设计既符合古代军事防御中避免敌人长驱直入的原则，同时又蕴含着风水不外流之意，还使瓮城城门指向 800 米外的一座小山丘 “照壁” 和 “照壁” 上象征北斗七星的七棵槐树。当敌人攻入瓮城时，守军可以从瓮城城墙、城门以及北堡门等多个方向对敌人进行攻击，形成交叉火力，使敌人陷入四面受敌的困境，有效延缓敌人的进攻速度，消耗其有生力量。瓮城上的宗教祠庙体现了多种宗教文化在张壁古堡的融合与共存，反映了当时当地丰富多元的宗教信仰和文化氛围，这些祠庙不仅是人们精神寄托的场所，也成为了古堡文化景观的重要组成部分。"}, {"name": "吕祖阁", "position": [111.97324, 36.96407], "introduction": "吕祖阁位于北门瓮城东端德星聚门楼上，坐东朝西，是一座融合了防卫功能与窑洞技术的道教建筑。始建年代无考，据《重修吕祖阁碑记》载，自道光十一年始龛仙像于斯，光绪二年五月动工扩建重修，使神阁焕然一新，后于宣统二年（1910 年）又进行了重修。窑洞式带廊结构：吕祖阁为窑洞式带廊建筑，面阔一间，占地面积 24.3 平方米。这种建筑方式利用了窑洞的厚土与外墙面的砖，增强了防卫能力，从堡外看仍是由雉堞形成的城墙形象，体现了防卫与窑洞技术的巧妙结合。吕祖阁内供奉的是吕洞宾，他是道教中的重要人物，被尊为八仙之一，号纯阳子，道号纯阳真人。吕洞宾在民间信仰中具有广泛的影响力，被视为神仙和道教文化的象征，人们供奉他以祈求平安、健康、好运等。作为道教建筑，吕祖阁是张壁古堡宗教文化的重要组成部分，反映了当时当地人们的道教信仰和宗教活动，对于研究道教在当地的传播和发展具有重要意义。"}, {"name": "天王殿~属于兴隆寺", "position": [111.97314, 36.96322], "introduction": "天王殿采用传统的木结构建筑形式，面阔三间或五间，进深若干间，屋顶多为歇山顶或硬山顶，飞檐斗拱，庄重而典雅。殿内空间开阔，以满足供奉神像和信徒朝拜的需求。作为张壁古堡众多庙宇建筑中的一员，天王殿的屋顶也大量使用了琉璃构件，色彩绚丽，工艺精湛，在阳光的照耀下熠熠生辉，为建筑增添了庄重与华丽之感。"}, {"name": "研学院", "position": [111.97331, 36.96284], "introduction": "张壁古堡研学院依托张壁古堡丰富的历史文化资源而设立。让学生学习到课本之外的历史、军事、建筑、民俗等多方面知识，拓宽知识面，加深对中国传统文化的理解。通过实地考察、亲身体验、小组合作等方式，提高学生的观察力、思考力、实践力和团队协作能力。沉浸式的研学体验，能够激发学生对历史文化的兴趣和热爱，增强他们对传统文化的认同感和自豪感，为传承和弘扬中华优秀传统文化奠定基础。"}, {"name": "围棋院", "position": [111.97393, 36.96361], "introduction": "2021 年 8 月注册成立。被山西省围棋协会授予 “最美乡村棋院” 称号，定为山西省围棋研学基地，被誉为 “中国最有品位乡村棋院”。聘请棋圣聂卫平为名誉院长、原中国围棋协会主席王汝南为顾问，还聘请了职业棋手金茜倩、黄焰、王隽、韩晔为教练。设有对弈室、围棋文化展厅、新闻中心等，设施完备、功能齐全、环境优雅，珍藏有众多古今中外围棋文化实物和典籍。多次举办、承办、参与省市围棋赛事，曾四次协办国家级围棋赛事，如第十一届 “中信和业杯” 中国女子围棋甲级联赛张壁古堡景区专场等。"}, {"name": "贮香瓢餐厅", "position": [111.97317, 36.96351], "introduction": "据记载，该餐厅传承已达三百余年，有着深厚的历史文化底蕴。餐厅内设开敞散座、雅致包厢，装修风格保留了传统中国风格，并融合现代特色，环境优雅，推窗可见小院风光，让食客在享受美食的同时，也能感受到惬意与悠闲。餐厅所在的张壁古堡有着千年历史，古色古香的建筑和悠久的历史文化，为餐厅营造出了独特的用餐氛围，使食客仿佛穿越时空，领略到古代的风情。既有传统的山西美食，也有一些创新菜品。特色菜包括五谷丰登莜面宴、老坛泡椒蒸鲈鱼、滋补锅仔羊肉、桑叶茶香酥皮虾、传统腐乳肉夹馍等，能满足不同食客的口味需求。张壁古堡贮香瓢餐厅被中国饭店协会、山西省饭店业商会、山西省品牌研究会、山西省现代农业产业发展协会授予了山西省 “十佳特色风味餐厅” 称号。"}, {"name": "槐抱柳广场", "position": [111.97314, 36.96298], "introduction": "广场上的古槐树已有千年树龄，在其树洞里长出一棵柳树，至今也逾 60 年，古槐茂盛，杨柳健硕，形成了罕见的 “槐抱柳” 现象，成为张壁古堡的一大奇观，吸引众多游客前来拍照留念。广场周边有古老的城墙、传统的建筑，与槐抱柳相互映衬，营造出浓厚的历史氛围，让人仿佛穿越时空，回到了古代。在张壁古堡举办的第八届地道中国年活动中，槐抱柳广场设有民俗社火表演，民俗背棍尽显乡村风情，百米长龙贯穿主街南北，舞旱船融入军事元素，扭秧歌、大头娃娃、民间故事表演等热闹非凡，让游客充分感受传统民俗的魅力。"}, {"name": "明月上西楼餐厅", "position": [111.97355, 36.96275], "introduction": "餐厅位于张壁古堡内，周边有着古色古香的建筑和浓厚的历史氛围，能让食客在就餐的同时感受到古堡的独特魅力。从位置上看，其临近大槐树，为游客提供了便捷的就餐选择。作为张壁古堡的一部分，明月上西楼餐厅不仅仅是一个就餐场所，还承载着传播当地文化的功能。食客在这里可以一边品尝美食，一边欣赏古堡的建筑风光，还可能有机会观看餐厅组织的营业性演出，深入体验当地的民俗文化和历史底蕴。"}, {"name": "德星聚饭庄，南门宴会厅", "position": [111.97251, 36.96066], "introduction": "无"}, {"name": "2号古灯杆", "position": [111.97352, 36.96179], "introduction": "无"}, {"name": "婚俗院", "position": [111.97341, 36.96238], "introduction": "介休婚俗特点"}, {"name": "古堡核桃(泥人冯）", "position": [111.97347, 36.96228], "introduction": "无"},  {"name": "游客中心卫生间", "position": [111.97332, 36.96078], "introduction": "无"}, {"name": "检票口卫生间", "position": [111.9734, 36.96101], "introduction": "无"}, {"name": "地道中段卫生间", "position": [111.97182, 36.96082], "introduction": "无"}, {"name": "地道出口卫生间", "position": [111.97092, 36.96234], "introduction": "无"}, {"name": "张家会堂卫生间", "position": [111.97225, 36.96234], "introduction": "无"}, {"name": "二郎庙卫生间", "position": [111.97274, 36.9639], "introduction": "无"}, {"name": "槐抱柳卫生间", "position": [111.97347, 36.96312], "introduction": "无"}, {"name": "扎染坊卫生间", "position": [111.97317, 36.96208], "introduction": "无"}, {"name": "1号停车场", "position": [111.972747, 36.960921], "introduction": "无"}, {"name": "2号停车场", "position": [111.974904, 36.961474], "introduction": "无"}, {"name": "南门检票口", "position": [111.97326, 36.96097], "introduction": "无"}, {"name": "泥包铁像", "position": [111.97322, 36.9609], "introduction": "无"}];
