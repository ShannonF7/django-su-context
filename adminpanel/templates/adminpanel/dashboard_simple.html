<!DOCTYPE html>
<html lang="zh" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理后台 - 首页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(195deg, #42424a 0%, #191919 100%);
        }
        .navbar-brand {
            color: white !important;
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
        }
        .nav-link:hover {
            color: white !important;
        }
        .card {
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(0, 0, 0, 0.125);
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1) !important;
            border-color: var(--bs-primary);
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-speedometer2 me-2"></i>
                管理后台
            </a>
            <div class="ms-auto">
                <a href="/accounts/logout/" class="btn btn-outline-light">
                    <i class="bi bi-box-arrow-right me-2"></i>退出
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-4">
        <div class="card border-0 shadow">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0">
                    <i class="bi bi-speedometer2 me-2"></i>
                    管理仪表盘
                </h5>
            </div>

            <div class="card-body">
                <div class="row g-4">
                    <!-- 欢迎信息 -->
                    <div class="col-12">
                        <div class="alert alert-primary mb-0">
                            <i class="bi bi-person-circle me-2"></i>
                            欢迎回来，管理员 {{ request.user.username }}
                        </div>
                    </div>

                    <!-- 功能卡片 -->
                    <div class="col-12 col-md-6">
                        <a href="{% url 'adminpanel:user_list' %}" class="card h-100 text-decoration-none">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div>
                                        <h5 class="card-title mb-1 fs-5">用户管理</h5>
                                        <p class="text-muted small mb-0">管理系统用户和权限</p>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-12 col-md-6">
                        <a href="{% url 'adminpanel:user_behavior_overview' %}" class="card h-100 text-decoration-none">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div>
                                        <h5 class="card-title mb-1 fs-5">用户行为</h5>
                                        <p class="text-muted small mb-0">评估用户行为</p>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-12 col-md-6">
                        <a href="{% url 'adminpanel:employee_performance_dashboard' %}" class="card h-100 text-decoration-none">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div>
                                        <h5 class="card-title mb-1 fs-5">员工绩效</h5>
                                        <p class="text-muted small mb-0">员工绩效报表</p>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
