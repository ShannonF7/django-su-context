<!DOCTYPE html>
<html lang="zh" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}管理后台{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .sidebar {
            width: 280px;
            background: linear-gradient(195deg, #42424a 0%, #191919 100%);
            height: 100vh;
            position: fixed;
            left: 0;
            z-index: 1000;
            transition: transform 0.3s ease-in-out, width 0.3s;
        }

        .main-content {
            margin-left: 280px;
            min-height: 100vh;
            transition: margin 0.3s ease-in-out;
        }

        /* 页面加载时禁用过渡动画，避免闪烁 */
        .sidebar.no-transition,
        .main-content.no-transition,
        .no-transition .sidebar,
        .no-transition .main-content {
            transition: none !important;
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .main-content.collapsed {
            margin-left: 80px;
        }

        .sidebar.collapsed .nav-link span,
        .sidebar.collapsed h3 {
            display: none;
        }

        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0 !important;
            }
        }

        @media (max-width: 767px) {
            .card-title {
                font-size: 1.1rem;
            }

            .text-truncate {
                max-width: 200px;
            }
        }

        .table-hover tbody tr {
            transition: background-color 0.2s;
        }

        .table-hover tbody tr:hover {
            background-color: #f8f9fa;
        }

        .page-link {
            min-width: 40px;
            text-align: center;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            padding: 12px 20px !important;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: white !important;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 999;
            display: none;
        }

    /* .diff-container {
        max-height: 300px;
        overflow-y: auto;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 5px;
        border: 1px solid #dee2e6;
    }

    .diff-add {
        background-color: #d4edda;
        padding: 2px 5px;
        margin: 2px 0;
    }

    .diff-remove {
        background-color: #f8d7da;
        padding: 2px 5px;
        margin: 2px 0;
        text-decoration: line-through;
    } */

/* ==================== Simple Side-by-Side Diff Styles (Flexbox) ==================== */
/* 容器 */
.simple-diff-container {
    font-family: 'Courier New', 'Consolas', 'Liberation Mono', monospace; /* 等宽字体 */
    font-size: 0.9em;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 10px;
    background-color: #f9f9f9;
    margin-bottom: 1rem;
    /* 使用 Flexbox 垂直排列两个 diff-row */
    display: flex;
    flex-direction: column;
}

/* 行容器 */
.diff-row {
    /* 使用 Flexbox 水平排列标签和内容 */
    display: flex;
    margin-bottom: 5px;
    /* align-items: flex-start; 顶部对齐，通常默认就是 */
}

/* 标签 */
.diff-label {
    font-weight: bold;
    /* padding-right: 10px; */
    text-align: left; /* 或 right，根据喜好 */
    color: #555;
    /* 关键：让标签宽度自适应其内容 */
    width: auto;
    min-width: fit-content; /* 确保能容纳文字 */
    margin-right: 10px; /* 在标签和内容之间添加一点间距 */
    /* 可选：添加轻微背景或边框以区分 */
    /* background-color: #f0f0f0; */
    /* border-right: 1px solid #eee; */
    padding: 0 5px; /* 给标签一点内边距 */
    flex-shrink: 0; /* 不允许标签被压缩 */
}

/* 内容区域 */
.diff-content {
    /* 关键：占据所有可用的剩余空间 */
    flex-grow: 1;
    /* flex-shrink: 1; */ /* 允许在必要时收缩 (默认值) */
    /* flex-basis: 0; */ /* 初始主轴大小为 0 (通常与 flex-grow 配合) */

    padding: 5px;
    border-radius: 3px;
    background-color: #fff;
    border: 1px solid #eee;
    /* 关键：强制换行 */
    white-space: pre-wrap; /* 保留空格和换行符，并允许换行 */
    word-break: break-all; /* 在任何字符间断行 */
    overflow-wrap: break-word; /* 处理长单词 */
    line-break: anywhere; /* 对 CJK 更友好 */
}

/* 原文内容区域 - 可选不同背景 */
.diff-original {
    /* background-color: #fafafa; */
}

/* 修改后内容区域 - 可选不同背景 */
.diff-modified {
    /* background-color: #f5fff5; */
}

/* 差异高亮 - 删除 */
.diff-remove {
    background-color: #ffe6e6; /* 浅红色背景 */
    color: #cc0000; /* 深红色文字 */
    text-decoration: line-through; /* 删除线 */
}

/* 差异高亮 - 新增 */
.diff-add {
    background-color: #e6ffe6; /* 浅绿色背景 */
    color: #006600; /* 深绿色文字 */
    text-decoration: underline; /* 下划线 */
}
/* ==================== Simple Side-by-Side Diff Styles (End) ==================== */
    </style>
</head>

<body>
    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="p-4">
            <h3 class="text-white mb-4">管理后台</h3>
            <ul class="nav flex-column gap-2">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'adminpanel:user_list' %}">
                        <i class="bi bi-people me-2"></i>
                        <span>用户管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'adminpanel:user_behavior_overview' %}">
                        <i class="bi bi-person-lines-fill me-2"></i>
                        <span>用户行为</span>
                    </a>
                </li>
                {% if request.resolver_match.url_name != 'admin_dashboard' %}
                <li class="nav-item">
                        <a class="nav-link" href="{% url 'adminpanel:employee_performance_dashboard' %}">
                        <i class="bi bi-graph-up me-2"></i>
                        <span>绩效概览</span>
                    </a>
                </li>
                {% endif %}
                <!-- <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-upload me-2"></i>
                        <span>批量上传</span>
                    </a>
                </li> -->
            </ul>
        </div>
    </div>

    <div class="sidebar-overlay"></div>

    <div class="main-content" id="main-content">
        <nav class="navbar navbar-expand-lg bg-white shadow-sm">
            <div class="container-fluid">
                <button class="btn btn-link d-none d-lg-inline sidebar-collapse" type="button">
                    <i class="bi bi-chevron-double-left"></i>
                </button>
                <button class="btn btn-link d-lg-none sidebar-toggle" type="button">
                    <i class="bi bi-list"></i>
                </button>

                <div class="ms-auto">
                    <a href="/accounts/logout/" class="btn btn-outline-danger">
                        <i class="bi bi-box-arrow-right me-2"></i>退出
                    </a>
                </div>
            </div>
        </nav>

        <div class="container-fluid p-4">
            {% include 'adminpanel/_messages.html' %}
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.documentElement.classList.add('no-transition');
        
        document.addEventListener('DOMContentLoaded', function () {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const sidebarToggle = document.querySelector('.sidebar-toggle');
            const sidebarCollapse = document.querySelector('.sidebar-collapse');
            const overlay = document.querySelector('.sidebar-overlay');

            sidebar.classList.add('no-transition');
            mainContent.classList.add('no-transition');

            const isCollapsed = localStorage.getItem('sidebar-collapsed') === '1';
            if (window.innerWidth >= 992 && isCollapsed) {
                sidebar.classList.add('collapsed');
                mainContent.classList.add('collapsed');
                
                const icon = sidebarCollapse.querySelector('i');
                icon.classList.remove('bi-chevron-double-left');
                icon.classList.add('bi-chevron-double-right');
            }

            requestAnimationFrame(function() {
                document.documentElement.classList.remove('no-transition');
                sidebar.classList.remove('no-transition');
                mainContent.classList.remove('no-transition');
            });

            function toggleSidebarMobile() {
                sidebar.classList.toggle('active');
                overlay.style.display = sidebar.classList.contains('active') ? 'block' : 'none';
            }

            function toggleSidebarDesktop() {
                sidebar.classList.toggle('collapsed');
                mainContent.classList.toggle('collapsed');

                const icon = sidebarCollapse.querySelector('i');
                icon.classList.toggle('bi-chevron-double-left');
                icon.classList.toggle('bi-chevron-double-right');

                localStorage.setItem('sidebar-collapsed', sidebar.classList.contains('collapsed') ? '1' : '0');
            }

            sidebarToggle?.addEventListener('click', toggleSidebarMobile);
            overlay?.addEventListener('click', toggleSidebarMobile);
            sidebarCollapse?.addEventListener('click', toggleSidebarDesktop);

            window.addEventListener('resize', function () {
                if (window.innerWidth >= 992) {
                    sidebar.classList.remove('active');
                    overlay.style.display = 'none';
                }
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
