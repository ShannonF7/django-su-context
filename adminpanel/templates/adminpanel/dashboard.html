{% extends "adminpanel/base.html" %}

{% block title %}后台首页{% endblock %}

{% block content %}
<div class="card border-0 shadow">
    <div class="card-header bg-white py-3">
        <h5 class="mb-0">
            <i class="bi bi-speedometer2 me-2"></i>
            管理仪表盘
        </h5>
    </div>

    <div class="card-body">
        <div class="row g-4">
            <!-- 欢迎信息 -->
            <div class="col-12">
                <div class="alert alert-primary mb-0">
                    <i class="bi bi-person-circle me-2"></i>
                    欢迎回来，管理员 {{ request.user.username }}
                </div>
            </div>

            <!-- 功能卡片 -->
            <div class="col-12 col-md-6">
                <a href="{% url 'adminpanel:user_list' %}" class="card h-100 text-decoration-none hover-effect">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div>
                                <h5 class="card-title mb-1 fs-5">用户管理</h5>
                                <p class="text-muted small mb-0">管理系统用户和权限</p>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-12 col-md-6">
                <a href="{% url 'adminpanel:changelog_list' %}" class="card h-100 text-decoration-none hover-effect">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div>
                                <h5 class="card-title mb-1 fs-5">操作记录</h5>
                                <p class="text-muted small mb-0">查看系统操作历史</p>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    /* 自定义效果 */
    .hover-effect {
        transition: transform 0.2s, box-shadow 0.2s;
        border: 1px solid rgba(0, 0, 0, 0.125);
    }

    .hover-effect:hover {
        transform: translateY(-3px);
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1) !important;
        border-color: var(--bs-primary);
    }
</style>
{% endblock %}
