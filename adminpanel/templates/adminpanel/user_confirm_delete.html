<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <title>确认删除用户</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-xl font-semibold mb-4">确认删除用户</h1>
        <p>你确定要删除用户 <strong>{{ user.username }}</strong> 吗？此操作不可撤销。</p>

        <form method="post" class="mt-4">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">确认删除</button>
            <a href="{% url 'adminpanel:user_list' %}" class="ml-4 text-gray-600 hover:underline">取消</a>
        </form>
    </div>
</body>

</html>
