server {
    listen 8010;
    server_name 221.180.19.170;

    charset utf-8;

    client_max_body_size 20M;

    # CORS 配置（解决跨域问题）
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

    # 处理预检请求（OPTIONS）
    if ($request_method = OPTIONS ) {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # 优化代理设置
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 24k;
    proxy_temp_file_write_size 24k;# 优化代理设置

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 启用长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /static/ {
        alias /home/lab420pro/tsn/feedback_project/staticfiles/;
        expires 30d;  # 设置静态文件缓存时间
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /home/lab420pro/tsn/feedback_project/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    access_log /home/lab420pro/tsn/feedback_project/nginx_access.log;
    error_log  /home/lab420pro/tsn/feedback_project/nginx_error.log;
}
